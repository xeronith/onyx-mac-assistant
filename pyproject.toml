[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onyx-mac-assistant"
version = "1.0.0"
description = "Ultra-fast, 100% offline macOS assistant powered by on-device SLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Xeronith" }
]
dependencies = [
    "cactus-compute==4.0.2"
]

[project.scripts]
onyx = "agent:main"
